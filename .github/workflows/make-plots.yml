# Examples using poetry in github workflows: https://github.com/snok/install-poetry?tab=readme-ov-file#workflow-examples-and-tips

name: Update plots
on:
  schedule:
    # At 00:00 on Sunday (once a week)
    - cron: '0 0 * * 0'
  workflow_dispatch:  # allow manual runs from the Actions tab
permissions:
  contents: write
jobs:
  create-and-commit-file:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up python
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.2
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Install dependencies
      run: poetry install --no-interaction --no-root

    # Each data source can fail independently (e.g. StatCan timing out); keep going so the
    # plots that did succeed still get committed, then fail the job at the end.
    - name: Create GHG plots
      id: ghg
      continue-on-error: true
      run: |
        source $VENV
        python make_ghg_plots.py

    - name: Create emissions plots
      id: emissions
      continue-on-error: true
      run: |
        source $VENV
        python make_emissions_plots.py

    - name: Create Vehicle Registrations plots
      id: ev
      continue-on-error: true
      run: |
        source $VENV
        python make_ev_registration_plots.py

    - name: setup git config
      run: |
        # setup the username and email. I tend to use 'GitHub Actions Bot' with no email by default
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"

    - name: Commit and push
      run: |
        git add plots
        if git diff --cached --quiet; then
          echo "No plot changes to commit"
        else
          git commit -m "Automated plots update: $(date '+%Y-%m-%d')"
          git push origin main
        fi

    - name: Fail if any plot step failed
      if: steps.ghg.outcome == 'failure' || steps.emissions.outcome == 'failure' || steps.ev.outcome == 'failure'
      run: |
        echo "GHG plots: ${{ steps.ghg.outcome }}, emissions plots: ${{ steps.emissions.outcome }}, vehicle registration plots: ${{ steps.ev.outcome }}"
        exit 1